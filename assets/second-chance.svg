<title id="title">An old blocker. A new plan.</title><desc id="desc">Synthetic research example: an old plan waited for a 6000-yuan agency budget. Later context supplied 12 person-hours and recruitment prospects. The revised plan supports up to eight interviews and 800 yuan in incentives. No interviews have been completed.</desc>
